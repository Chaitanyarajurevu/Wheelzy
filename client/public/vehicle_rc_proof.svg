      <text x="47" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">RTO APPROVED</text>
      <text x="47" y="38" font-family="monospace" font-size="8" font-weight="700" fill="#A7F3D0" text-anchor="middle">COMPLIANCE ✓</text>
