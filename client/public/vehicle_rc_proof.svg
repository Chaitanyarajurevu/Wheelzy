  <text x="350" y="270" font-family="system-ui, sans-serif" font-size="70" font-weight="900" fill="#047857" opacity="0.04" text-anchor="middle" transform="rotate(-15 350 270)">WHEELZY FLEET</text>

  <!-- Form 23 Grid Container -->
