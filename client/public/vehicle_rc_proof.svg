  <text x="95" y="44" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" letter-spacing="1">MINISTRY OF ROAD TRANSPORT &amp; HIGHWAYS</text>
  <text x="95" y="68" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#A7F3D0" letter-spacing="2">CERTIFICATE OF REGISTRATION (FORM 23) · MOTOR VEHICLES ACT</text>

  <rect x="510" y="22" width="155" height="50" rx="12" fill="#022C22" stroke="#34D399" stroke-width="1.5" />
