    <text x="60" y="46" font-family="monospace" font-size="10" font-weight="700" fill="#047857">minio://wheelzy-docs/vehicles/rc_v3_verified.pdf · HASH: e3b0c44298fc1c149afbf4c8996fb92427ae41e</text>

    <g transform="translate(520, 10)">
