<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flagSaffron" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#FF7700"/>
    </linearGradient>
    <linearGradient id="flagGreen" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#138808"/>
      <stop offset="100%" stop-color="#0E6506"/>
    </linearGradient>
    <pattern id="guilloche" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 Q10 0 20 20 T40 20 M0 20 Q10 40 20 20 T40 20" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Card Body with subtle rounded border -->
  <rect x="0" y="0" width="800" height="500" rx="26" fill="#FFFFFF"/>
  <rect x="2" y="2" width="796" height="496" rx="24" fill="url(#guilloche)" opacity="0.6"/>
  <rect x="2" y="2" width="796" height="496" rx="24" fill="none" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Top Tricolor Ribbon -->
  <rect x="0" y="0" width="800" height="12" rx="26" fill="url(#flagSaffron)"/>
  <rect x="0" y="10" width="800" height="6" fill="#FFFFFF"/>
  <rect x="0" y="16" width="800" height="8" fill="url(#flagGreen)"/>

  <!-- Official Emblem of India Representation -->
  <g transform="translate(48, 38)">
    <circle cx="28" cy="28" r="24" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <path d="M28 10 L34 26 L22 26 Z M20 28 H36 V42 H20 Z" fill="#92400E"/>
    <circle cx="28" cy="34" r="5" fill="#D97706"/>
    <rect x="18" y="44" width="20" height="3" fill="#92400E"/>
  </g>

  <!-- Central Government Header -->
  <text x="120" y="52" fill="#1E293B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">भारत सरकार</text>
  <text x="120" y="70" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="0.5">GOVERNMENT OF INDIA</text>
  <text x="120" y="86" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">UNIQUE IDENTIFICATION AUTHORITY OF INDIA</text>

  <!-- Aadhaar Sun Emblem on Top Right -->
  <g transform="translate(680, 36)">
    <circle cx="36" cy="28" r="18" fill="#DC2626"/>
    <path d="M36 4 L38 10 L44 6 L42 12 L48 10 L44 15 L50 16 L45 20 L51 22 L45 25 L50 28 L44 30 L48 34 L42 33 L44 39 L38 36 L36 42 L34 36 L28 39 L30 33 L24 34 L28 30 L22 28 L27 25 L21 22 L27 20 L22 16 L28 15 L24 10 L30 12 L28 6 L34 10 Z" fill="#DC2626" opacity="0.4"/>
    <circle cx="36" cy="28" r="12" fill="#FFFFFF"/>
    <circle cx="36" cy="28" r="8" fill="#EA580C"/>
  </g>

  <!-- Red Separator Line -->
  <rect x="40" y="100" width="720" height="2" fill="#DC2626" opacity="0.6"/>

  <!-- Left Photo Box Container -->
  <rect x="48" y="130" width="160" height="200" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <image href="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&amp;auto=format&amp;fit=crop&amp;q=80" x="50" y="132" width="156" height="196" preserveAspectRatio="xMidYMid slice" clip-path="inset(0% round 12px)"/>

  <!-- Verified Security Badge under Photo -->
  <rect x="48" y="340" width="160" height="30" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="128" y="360" text-anchor="middle" fill="#065F46" font-family="sans-serif" font-size="11" font-weight="800">UIDAI VERIFIED ✓</text>

  <!-- Middle Details Section -->
  <g transform="translate(236, 140)">
    <!-- Name in Hindi & English -->
    <text x="0" y="18" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="700">NAME / नाम</text>
    <text x="0" y="44" fill="#0F172A" font-family="sans-serif" font-size="24" font-weight="900">Priya Sharma</text>
    <text x="0" y="66" fill="#475569" font-family="sans-serif" font-size="14" font-weight="700">प्रिया शर्मा</text>

    <!-- DOB -->
    <text x="0" y="104" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="700">DOB / जन्म तिथि</text>
    <text x="0" y="126" fill="#0F172A" font-family="sans-serif" font-size="15" font-weight="800">15/08/2004</text>

    <!-- Gender -->
    <text x="180" y="104" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="700">GENDER / लिंग</text>
    <text x="180" y="126" fill="#0F172A" font-family="sans-serif" font-size="15" font-weight="800">Female / महिला</text>

    <!-- Address / Campus State -->
    <text x="0" y="162" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="700">CAMPUS ADDRESS / पता</text>
    <text x="0" y="182" fill="#334155" font-family="sans-serif" font-size="12" font-weight="600">Unit 1 Resident Hall, UC Berkeley Campus, CA 94720</text>
  </g>

  <!-- Right QR Code Mock -->
  <g transform="translate(600, 130)">
    <rect x="0" y="0" width="150" height="150" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <!-- QR Finder 1 -->
    <rect x="14" y="14" width="34" height="34" fill="#0F172A"/>
    <rect x="20" y="20" width="22" height="22" fill="#FFFFFF"/>
    <rect x="25" y="25" width="12" height="12" fill="#0F172A"/>
    <!-- QR Finder 2 -->
    <rect x="102" y="14" width="34" height="34" fill="#0F172A"/>
    <rect x="108" y="20" width="22" height="22" fill="#FFFFFF"/>
    <rect x="113" y="25" width="12" height="12" fill="#0F172A"/>
    <!-- QR Finder 3 -->
    <rect x="14" y="102" width="34" height="34" fill="#0F172A"/>
    <rect x="20" y="108" width="22" height="22" fill="#FFFFFF"/>
    <rect x="25" y="113" width="12" height="12" fill="#0F172A"/>
    <!-- QR Random Data Dots -->
    <rect x="58" y="20" width="8" height="8" fill="#0F172A"/>
    <rect x="74" y="16" width="12" height="8" fill="#0F172A"/>
    <rect x="58" y="38" width="16" height="8" fill="#0F172A"/>
    <rect x="80" y="32" width="8" height="16" fill="#0F172A"/>
    <rect x="58" y="58" width="34" height="34" fill="#0F172A"/>
    <rect x="66" y="66" width="18" height="18" fill="#FFFFFF"/>
    <rect x="71" y="71" width="8" height="8" fill="#0F172A"/>
    <rect x="102" y="58" width="8" height="14" fill="#0F172A"/>
    <rect x="118" y="64" width="14" height="8" fill="#0F172A"/>
    <rect x="102" y="80" width="18" height="8" fill="#0F172A"/>
    <rect x="126" y="94" width="10" height="14" fill="#0F172A"/>
    <rect x="58" y="102" width="12" height="8" fill="#0F172A"/>
    <rect x="76" y="110" width="16" height="12" fill="#0F172A"/>
    <rect x="58" y="126" width="24" height="8" fill="#0F172A"/>
    <rect x="102" y="118" width="12" height="16" fill="#0F172A"/>
    <text x="75" y="168" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="700">SECURE DIGITAL QR</text>
  </g>

  <!-- Highlighted Aadhaar Number Bar (Center Bottom) -->
  <rect x="48" y="390" width="704" height="54" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="400" y="426" text-anchor="middle" fill="#B91C1C" font-family="monospace, sans-serif" font-size="28" font-weight="900" letter-spacing="4">
    XXXX  XXXX  9021
  </text>

  <!-- Tagline at the very bottom -->
  <rect x="0" y="466" width="800" height="34" rx="26" fill="#0F172A"/>
  <text x="400" y="488" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1">
    मेरा आधार, मेरी पहचान • AADHAAR - WHEELZY PEER VERIFIED IDENTITY
  </text>
</svg>
