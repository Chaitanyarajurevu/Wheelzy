    <path d="M 20 52 Q 40 38 60 52 T 100 48 T 130 55 T 160 45" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="62" x2="170" y2="62" stroke="#94A3B8" stroke-width="1" />

    <!-- Simulated Barcode -->
    <g transform="translate(200, 18)">
      <text x="0" y="0" font-family="sans-serif" font-size="8" font-weight="700" fill="#64748B">PDF417 BIOMETRIC BARCODE</text>
      <rect x="0" y="8" width="4" height="42" fill="#0F172A" />
      <rect x="7" y="8" width="2" height="42" fill="#0F172A" />
      <rect x="12" y="8" width="6" height="42" fill="#0F172A" />
      <rect x="22" y="8" width="3" height="42" fill="#0F172A" />
      <rect x="28" y="8" width="8" height="42" fill="#0F172A" />
      <rect x="39" y="8" width="2" height="42" fill="#0F172A" />
      <rect x="44" y="8" width="5" height="42" fill="#0F172A" />
      <rect x="52" y="8" width="3" height="42" fill="#0F172A" />
      <rect x="58" y="8" width="7" height="42" fill="#0F172A" />
      <rect x="68" y="8" width="2" height="42" fill="#0F172A" />
      <rect x="73" y="8" width="6" height="42" fill="#0F172A" />
      <rect x="82" y="8" width="4" height="42" fill="#0F172A" />
      <rect x="89" y="8" width="3" height="42" fill="#0F172A" />
      <rect x="95" y="8" width="8" height="42" fill="#0F172A" />
      <rect x="106" y="8" width="3" height="42" fill="#0F172A" />
      <rect x="112" y="8" width="5" height="42" fill="#0F172A" />
      <rect x="120" y="8" width="3" height="42" fill="#0F172A" />
      <rect x="126" y="8" width="7" height="42" fill="#0F172A" />
      <rect x="136" y="8" width="2" height="42" fill="#0F172A" />
      <rect x="141" y="8" width="8" height="42" fill="#0F172A" />
      <rect x="152" y="8" width="4" height="42" fill="#0F172A" />
      <rect x="159" y="8" width="6" height="42" fill="#0F172A" />
      <rect x="168" y="8" width="3" height="42" fill="#0F172A" />
      <rect x="174" y="8" width="6" height="42" fill="#0F172A" />
      <rect x="183" y="8" width="3" height="42" fill="#0F172A" />
      <rect x="189" y="8" width="7" height="42" fill="#0F172A" />
      <rect x="199" y="8" width="4" height="42" fill="#0F172A" />
      <rect x="206" y="8" width="8" height="42" fill="#0F172A" />
      <rect x="217" y="8" width="3" height="42" fill="#0F172A" />
      <rect x="223" y="8" width="5" height="42" fill="#0F172A" />
      <rect x="231" y="8" width="4" height="42" fill="#0F172A" />
      <rect x="238" y="8" width="6" height="42" fill="#0F172A" />
      <text x="0" y="58" font-family="monospace" font-size="8" font-weight="700" fill="#64748B">WHZ-VERIFIED-AUTH-TOKEN-991204</text>
    </g>

    <!-- Authority Stamp -->
    <g transform="translate(490, 15)">
      <rect width="125" height="55" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
      <text x="62" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#047857" text-anchor="middle">AUTHENTICATED</text>
      <text x="62" y="42" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#065F46" text-anchor="middle">TRANSPORT REGISTRY</text>
    </g>
  </g>
</svg>
