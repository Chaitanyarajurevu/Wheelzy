<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="100%" height="100%">
  <defs>
    <linearGradient id="dlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="60%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="dlHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="hologram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.25" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="680" height="420" x="10" y="10" rx="24" fill="url(#dlBg)" stroke="#CBD5E1" stroke-width="2" filter="url(#cardShadow)"/>

  <!-- Top Blue Header Banner -->
  <path d="M 10 34 Q 10 10 34 10 L 666 10 Q 690 10 690 34 L 690 90 L 10 90 Z" fill="url(#dlHeader)"/>

  <!-- State Seal Crest -->
  <g transform="translate(32, 22)">
    <circle cx="28" cy="28" r="26" fill="#F8FAFC" opacity="0.15" />
    <circle cx="28" cy="28" r="24" fill="none" stroke="#FDE047" stroke-width="2" stroke-dasharray="4 2" />
    <path d="M 28 10 L 32 22 L 44 22 L 34 30 L 38 42 L 28 34 L 18 42 L 22 30 L 12 22 L 24 22 Z" fill="#FDE047" opacity="0.9" />
  </g>

  <!-- Header Titles -->
  <text x="96" y="42" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" letter-spacing="1">DEPARTMENT OF MOTOR VEHICLES</text>
  <text x="96" y="66" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#93C5FD" letter-spacing="2">UNION TRANSPORT AUTHORITY · DRIVER LICENSE</text>
  <rect x="520" y="24" width="145" height="42" rx="10" fill="#1E40AF" stroke="#60A5FA" stroke-width="1.5" />
  <text x="592" y="44" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#93C5FD" text-anchor="middle">LICENSE CLASS</text>
  <text x="592" y="60" font-family="monospace" font-size="14" font-weight="900" fill="#FDE047" text-anchor="middle">MCWG / LMV</text>

  <!-- Decorative Guilloche Background Pattern Lines -->
  <path d="M 30 140 Q 350 110 670 140 M 30 190 Q 350 220 670 190 M 30 250 Q 350 220 670 250 M 30 310 Q 350 340 670 310" stroke="#94A3B8" stroke-width="0.8" opacity="0.2" fill="none"/>

  <!-- Left Photo Box -->
  <g transform="translate(35, 115)">
    <rect width="145" height="185" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" />
    <!-- Avatar / Silhouette placeholder -->
    <rect width="135" height="175" x="5" y="5" rx="12" fill="#E2E8F0" />
    <!-- Head -->
    <circle cx="72" cy="70" r="34" fill="#64748B" />
    <!-- Shoulders -->
    <path d="M 22 175 C 22 125, 122 125, 122 175 Z" fill="#64748B" />
    <!-- Photo Seal Overlay -->
    <circle cx="120" cy="160" r="18" fill="url(#hologram)" stroke="#059669" stroke-width="1" />
    <text x="120" y="164" font-family="sans-serif" font-size="9" font-weight="900" fill="#047857" text-anchor="middle">DMV</text>
  </g>

  <!-- Smart Chip Icon -->
  <g transform="translate(205, 115)">
    <rect width="52" height="40" rx="8" fill="#FBBF24" stroke="#D97706" stroke-width="1.5" />
    <path d="M 205 135 L 257 135 M 220 115 L 220 155 M 242 115 L 242 155" stroke="#92400E" stroke-width="1" />
  </g>

  <!-- DL Number Banner -->
  <g transform="translate(275, 115)">
    <text x="0" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#64748B">DRIVER LICENSE NUMBER</text>
    <text x="0" y="38" font-family="monospace" font-size="22" font-weight="900" fill="#0F172A" letter-spacing="2">DL-04-2024-9921448</text>
  </g>

  <!-- Driver Details Field Grid -->
  <g transform="translate(205, 175)">
    <!-- Name -->
    <text x="0" y="14" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748B">FULL LEGAL NAME</text>
    <text x="0" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#0F172A">PRIYA NAIR</text>

    <!-- DOB & Blood Group -->
    <text x="0" y="65" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748B">DATE OF BIRTH</text>
    <text x="0" y="83" font-family="monospace" font-size="13" font-weight="800" fill="#0F172A">14-07-2004</text>

    <text x="140" y="65" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748B">BLOOD GRP</text>
    <text x="140" y="83" font-family="monospace" font-size="13" font-weight="900" fill="#DC2626">O +VE</text>

    <text x="250" y="65" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748B">ORGAN DONOR</text>
    <text x="250" y="83" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#059669">YES ✓</text>

    <!-- Issue & Expiry Dates -->
    <text x="0" y="115" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748B">ISSUE DATE</text>
    <text x="0" y="133" font-family="monospace" font-size="13" font-weight="800" fill="#0F172A">22-01-2024</text>

    <text x="140" y="115" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748B">VALID TILL (EXPIRY)</text>
    <text x="140" y="133" font-family="monospace" font-size="13" font-weight="900" fill="#2563EB">21-01-2044</text>

    <text x="270" y="115" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748B">CAMPUS HUB</text>
    <text x="270" y="133" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0F172A">UC BERKELEY</text>
  </g>

  <!-- Security Hologram Badge -->
  <g transform="translate(540, 200)">
    <rect width="120" height="95" rx="14" fill="url(#hologram)" stroke="#10B981" stroke-width="1.5" />
    <circle cx="60" cy="40" r="22" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="3 3" />
    <path d="M 52 40 L 58 46 L 68 34" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" />
    <text x="60" y="75" font-family="sans-serif" font-size="9" font-weight="800" fill="#047857" text-anchor="middle">DIGITALLY VERIFIED</text>
    <text x="60" y="87" font-family="monospace" font-size="8" font-weight="700" fill="#065F46" text-anchor="middle">DMV-SECURE-ID</text>
  </g>

  <!-- Bottom Bar with Barcode and Signature -->
  <g transform="translate(35, 320)">
    <rect width="630" height="85" rx="16" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Signature Line -->
